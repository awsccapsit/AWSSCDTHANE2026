<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AWS Student Community Day Thane</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#fff;
    overflow-x:hidden;
}

/* ================= NAVBAR ================= */

header{

    position:fixed;

    top:0;
    left:0;

    width:100%;

    z-index:999;
    background: linear-gradient(
    90deg,
    #3E1E5C 0%,
    #592A83 50%,
    #7A49A8 100%
);

    backdrop-filter:blur(16px);

    transition:.35s;

}

.navbar{

    width:92%;

    max-width:1400px;

    margin:auto;

    height:90px;

    display:flex;

    justify-content:space-between;

    align-items:center;

}

/* ================= LOGO ================= */

.logo img{

    width:180px;

    display:block;

}

/* ================= MENU ================= */

.nav-links{

    display:flex;

    align-items:center;

    list-style:none;

    gap:42px;

}

.nav-links li{

    position:relative;

}

.nav-links li a{

    color:#fff;

    text-decoration:none;

    font-size:17px;

    font-weight:500;

    transition:.3s;

}

.nav-links li a:hover{

    color:#FF9900;

}

/* ================= DROPDOWN ================= */

.dropdown>a{

    display:flex;

    align-items:center;

    gap:8px;

}

.dropdown-menu{

    position:absolute;

    top:55px;

    left:0;

    width:290px;

    background:#fff;

    border-radius:14px;

    overflow:hidden;

    opacity:0;

    visibility:hidden;

    transform:translateY(20px);

    transition:.35s;

    box-shadow:0 15px 45px rgba(0,0,0,.15);

}

.dropdown:hover .dropdown-menu{

    opacity:1;

    visibility:visible;

    transform:translateY(0);

}

.dropdown-menu li{

    width:100%;

}

.dropdown-menu li a{

    display:block;

    padding:15px 22px;

    color:#2F3C5A;

    font-size:15px;

    transition:.3s;

}

.dropdown-menu li a:hover{

    background:#FFF4E6;

    color:#FF9900;

    padding-left:30px;

}

/* ================= REGISTER BUTTON ================= */

.register-btn{

    background:#FF9900;

    color:#fff;

    text-decoration:none;

    justify-content:center;

    padding:14px 30px;

    border-radius:8px;

    font-weight:600;

    transition:.3s;

    margin-left:120px;

}

.register-btn:hover{

    background:#E68700;

    transform:translateY(-2px);

}

/* ================= NAV ACTIONS / HAMBURGER (hidden on desktop, shown on mobile below) ================= */

.nav-actions{
    display:flex;
    align-items:center;
    gap:16px;
}

.menu-toggle{
    display:none;
    background:none;
    border:none;
    color:#fff;
    font-size:26px;
    cursor:pointer;
    z-index:1001;
    padding:4px 8px;
}

/* ================= HERO ================= */

.hero {
    position: relative;
    background: #f3f2fa;
    height: 100vh;
    height: 100dvh;
    min-height: 560px;
    overflow: hidden;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 0;
}

.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image: url("theme.svg");
    background-size: cover;
    background-position: center bottom;
    background-repeat: no-repeat;
    z-index: 0;
}

.hero-content {
    position: relative;
    z-index: 1;
    width: 92%;
    max-width: 1400px;
    margin: 0 auto;
    text-align: center;
}

/* Single centered vertical stack: logo -> button */
.hero-wrapper{
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
}

.hero-left,
.hero-right{
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* ================= HERO LOGO ================= */

.hero-logo{
    width: auto;
    height: auto;
    max-height: 90vh;
    max-width: 90vw;
    margin: 0 auto;
    display: block;
    margin-top: -40px;
}

.hero-content h4{

    color:#FF9900;

    letter-spacing:3px;

    font-size:20px;

    margin-bottom:18px;

    text-transform:uppercase;

}

.hero-content h1{
    font-size: clamp(24px, 3vw, 40px);
    margin: 0;
}

.hero-content h2{

    font-size:42px;

    margin-top:10px;

    color:#FFD580;

}

.hero-content p{
    width: 80%;
    max-width: 650px;
    margin: 28px auto 0;
}

/* ================= HERO BUTTONS ================= */

.hero-buttons{

    display:flex;

    gap:10px;

    justify-content:center;

    margin-top: clamp(-150px, -50vh, 200px);

}

.primary-btn{

    background:#FF9900;

    color:#fff;

    text-decoration:none;

    padding: clamp(10px, 1.8vh, 16px) clamp(20px, 3vw, 34px);

    border-radius:8px;

    font-size: clamp(14px, 1.6vh, 17px);

    font-weight:600;

    transition:.3s;

}

.primary-btn:hover{

    background:#E68A00;

    transform:translateY(-3px);

}

.secondary-btn{

    border:2px solid #fff;

    color:#fff;

    text-decoration:none;

    padding:16px 34px;

    border-radius:8px;

    font-size:17px;

    font-weight:600;

    transition:.3s;

}

.secondary-btn:hover{

    background:#fff;

    color:#2F3C5A;

}

/* ================= TABLET ================= */

@media(max-width:1100px){

.navbar{

    width:95%;

}

.nav-links{

    gap:24px;

}

.logo img{

    width:150px;

}

.hero-content h1{

    font-size:32px;

}

.hero-content h2{

    font-size:28px;

}

.hero-content p{

    width:100%;

    font-size:18px;

}

}

/* ================= MOBILE ================= */

@media(max-width:768px){

header{

    position:fixed; /* keep fixed so it doesn't push the hero down by its own stacked height */

}

.navbar{

    height:76px;

    padding:0;

}

.logo img{

    width:130px;

}

.menu-toggle{

    display:block;

}

.nav-links{

    position:fixed;

    top:76px;

    left:0;

    width:100%;

    flex-direction:column;

    align-items:flex-start;

    gap:0;

    background:#3E1E5C;

    max-height:0;

    overflow:hidden;

    transition:max-height .35s ease;

}

.nav-links.active{

    max-height:80vh;

    overflow-y:auto;

    box-shadow:0 15px 30px rgba(0,0,0,.25);

}

.nav-links li{

    width:100%;

}

.nav-links li a{

    display:block;

    padding:16px 24px;

    border-bottom:1px solid rgba(255,255,255,.1);

}

.dropdown>a{

    justify-content:space-between;

}

.dropdown-menu{

    position:static;

    opacity:1;

    visibility:visible;

    transform:none;

    width:100%;

    display:none;

    box-shadow:none;

    border-radius:0;

    background:rgba(0,0,0,.15);

}

.dropdown.open .dropdown-menu{

    display:block;

}

.dropdown-menu li a{

    color:#fff;

    padding:14px 40px;

}

.dropdown-menu li a:hover{

    background:rgba(255,255,255,.1);

    color:#FF9900;

    padding-left:46px;

}

.register-btn{

    margin-left:0;

    padding:10px 18px;

    font-size:14px;

}

/* ---- HERO ---- */

.hero{

    height:auto;

    min-height:100dvh;

    padding:96px 20px 40px;

    justify-content:center;

    align-items:center;   /* keep this LAST in the block, and make sure this is the ONLY .hero rule in this media query */

    margin-left: -20px;
}


.hero-logo{

    max-height:70vh;

    max-width:100vw;

    align-items:center;
    justify-content:center;

}

.hero-content{

    text-align:center;

}

.hero-content h1{

    font-size:24px;

}

.hero-content h2{

    font-size:20px;

}

.hero-content h4{

    font-size:14px;

}

.hero-content p{

    width:100%;

    font-size:15px;

}

.hero-buttons{

    justify-content:center;

    flex-wrap:wrap;

    margin-top:20px; /* overrides the desktop negative-vh trick, which doesn't work on mobile */

}

}

@media(max-width:400px){

.hero-logo{

    max-height:50vh;
    align-items:center;
    justify-content:center;

}

}

</style>

</head>

<body>

<!-- ================= HEADER ================= -->

<header>

<nav class="navbar">

<div class="logo">

<img src="logo.svg" alt="AWS Student Community Day">

</div>

<ul class="nav-links" id="navLinks">

<li><a href="#">Home</a></li>

<li class="dropdown">

<a href="#">
About
<i class="fa-solid fa-angle-down"></i>
</a>

<ul class="dropdown-menu">

<li><a href="#">Event</a></li>

<li><a href="#">Health + Safety</a></li>

<li><a href="#">Health Measures</a></li>

<li><a href="#">Safety Resources + Tips</a></li>

<li><a href="#">General Safety</a></li>

<li><a href="#">Safety Resources</a></li>

<li><a href="#">Code of Conduct</a></li>

</ul>

</li>

<li class="dropdown">

<a href="#">
Attend
<i class="fa-solid fa-angle-down"></i>
</a>

<ul class="dropdown-menu">

<li><a href="#">Travel</a></li>

<li><a href="#">Guidance</a></li>

<li><a href="#">FAQ</a></li>

</ul>

</li>

<li><a href="#">Schedule</a></li>

<li><a href="#">Contact</a></li>

</ul>

<div class="nav-actions">

<a href="#" class="register-btn">Register Now</a>

<button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
<i class="fa-solid fa-bars"></i>
</button>

</div>

</nav>

</header>

<!-- ================= HERO SECTION ================= -->

<section class="hero">

    <div class="hero-content">

        <div class="hero-wrapper">

            <!-- LOGO + REGISTER BUTTON -->
            <div class="hero-left">

                <img src="logo1.svg" class="hero-logo" alt="AWS Student Community Day">

                <div class="hero-buttons">
                    <a href="#" class="primary-btn">Register Now</a>
                </div>

            </div>

        </div>

    </div>

</section>

</section> -->

</section> -->

    <h2 style="font-size:42px;color:#2F3C5A;text-align:center;">Schedule</h2>
</section> -->

    <h2 style="font-size:42px;color:#2F3C5A;text-align:center;">Sponsors</h2>
</section> -->

    <h2 style="font-size:42px;color:#2F3C5A;text-align:center;">Contact Us</h2>
</section> -->

<script>
const menuToggle = document.getElementById('menuToggle');
const navLinks = document.getElementById('navLinks');

menuToggle.addEventListener('click', () => {
    navLinks.classList.toggle('active');
    const icon = menuToggle.querySelector('i');
    icon.classList.toggle('fa-bars');
    icon.classList.toggle('fa-xmark');
});

document.querySelectorAll('.dropdown > a').forEach(link => {
    link.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
            e.preventDefault();
            link.parentElement.classList.toggle('open');
        }
    });
});

document.querySelectorAll('.nav-links a:not(.dropdown > a)').forEach(link => {
    link.addEventListener('click', () => {
        if (window.innerWidth <= 768) {
            navLinks.classList.remove('active');
            const icon = menuToggle.querySelector('i');
            icon.classList.add('fa-bars');
            icon.classList.remove('fa-xmark');
        }
    });
});
</script>

</body>

</html>
